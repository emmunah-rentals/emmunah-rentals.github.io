.sheet.cont{background:#fff;padding:18mm 17mm 22mm}
.sheet.cont .pfoot{bottom:9mm}
.pfoot{position:absolute;left:17mm;right:17mm;bottom:34mm;display:flex;justify-content:space-between;
         align-items:flex-end;font-size:8.5pt;color:#333}
.pfoot img{width:17mm;opacity:.95}
h3.dt{font-size:calc(14pt*var(--fs));font-weight:700;text-align:center;margin:0 0 calc(5mm*var(--fs));letter-spacing:.02em}
.pbody{display:block}
.sheet.toolong{outline:2px solid #a33;outline-offset:-2px}
.toolongtag{position:absolute;top:4mm;right:6mm;background:#fbeaea;color:#a33;border:1px solid #e0a0a0;
    font:600 9pt/1.2 -apple-system,Helvetica,Arial,sans-serif;padding:3px 7px;border-radius:4px}
.cl{font-size:calc(9.5pt*var(--fs));line-height:1.34;margin:0 0 calc(2.1mm*var(--fs));text-align:justify}
.cl b{font-weight:700}
.cl.i{padding-left:9mm}
.cl.ii{padding-left:16mm}
h4.s{font-size:calc(10pt*var(--fs));font-weight:700;margin:calc(3.4mm*var(--fs)) 0 calc(1.7mm*var(--fs));text-decoration:underline}
.rule{border-bottom:1.1pt solid #000;margin:1.5mm 0 2mm}
.tick{display:inline-block;border:1pt solid #d08b2c;min-width:14mm;text-align:center;
        font-size:8pt;font-weight:700;padding:1.5mm 2mm;margin-right:5mm;background:#fff}
.tick.on{background:#e8f3ea;border-color:#1f7a44}
.ln{border-bottom:1.1pt solid #000;display:inline-block;height:1em;vertical-align:bottom}
.fill{border-bottom:.9pt solid #555;display:inline-block;min-width:38mm;padding:0 2px;font-weight:700}
.box{border:.8pt solid #999;padding:4px 7px;font-size:calc(9.5pt*var(--fs));min-height:7mm}
.ftab{width:100%}
.ftab td{border:.8pt solid #999;padding:calc(3px*var(--fs)) 7px;font-size:calc(9.5pt*var(--fs));height:calc(6.6mm*var(--fs));vertical-align:middle}
.ftab td.k{background:#f4f4f1;font-weight:700;width:38%}
.sig{margin-top:calc(6mm*var(--fs));font-size:calc(9.5pt*var(--fs));line-height:1.95}
@media print{.sheet{box-shadow:none;break-after:page;page-break-after:always;height:297mm}
.sheet:last-child{break-after:auto;page-change-after:auto;page-break-after:auto}}</style><style>
:root{--g:#1f7a44;--g2:#16603a;--ink:#141414;--mut:#6b6b66;--line:#e3e1dc;--bg:#f5f4f1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Segoe UI,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.topin img{height:30px}.topin .nm{font-weight:600;font-size:15px;flex:1}
.track{height:3px;background:#ecebe7}.track i{display:block;height:3px;background:var(--g);width:0;transition:width .35s}
main{max-width:640px;margin:0 auto;padding:22px 16px 120px}
h1{font-size:28px;line-height:1.15;margin:6px 0 10px;letter-spacing:-.01em}
h2{font-size:23px;margin:2px 0 8px;letter-spacing:-.01em}
.kick{color:var(--g);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.lead{color:#3d3d39;margin:0 0 16px}.small{color:var(--mut);font-size:13.5px}
.terms{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:14px 0}
.terms div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid #f0efeb;font-size:14.5px}
.terms div:first-child{border-top:0}.terms span{color:var(--mut)}.terms b{text-align:right;font-weight:600}
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.how div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px}
.how b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eaf5ee;color:var(--g);font-size:12px;margin-right:7px}
.grid{display:flex;flex-wrap:wrap;gap:0 12px}
.fld{width:100%;margin:0 0 14px}.fld.half{width:calc(50% - 6px)}
@media(max-width:420px){.fld.half{width:100%}}
.fld label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}.opt{color:var(--mut);font-weight:400;font-size:12.5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid #d6d4ce;border-radius:11px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:52px}
select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(31,122,68,.15)}
.bad{border-color:#c0392b!important}.er{color:#b3261e;font-size:13px;min-height:0}.hn{color:var(--mut);font-size:12.5px;margin-top:4px}.hn.warn{color:#a35a00}
.seg{display:flex;background:#ecebe7;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:600;color:#55554f}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barin{max-width:640px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;cursor:pointer}
.btn,#next,#back,.stack button{border:1px solid #d6d4ce;background:#fff;border-radius:999px;padding:13px 20px;font-weight:600;font-size:16px;color:var(--ink)}
#next,.stack .primary{background:var(--g);border-color:var(--g);color:#fff;flex:1}
#next:disabled{opacity:.6}
.stack{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.link{border:0;background:none;color:var(--g);font-weight:600;font-size:14px;padding:0}
.padlab{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:14px 0 6px}
.pad{width:100%;height:170px;background:#fff;border:1px dashed #b9b7b0;border-radius:12px;touch-action:none;display:block}
.pad.small{height:110px;width:60%}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:16px 0 6px}
.agree input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;-webkit-appearance:checkbox;appearance:auto;accent-color:var(--g)}
#docwrap{position:relative;overflow:hidden;margin:10px -16px 0;background:#e9e7e2;padding:0}
#docscale{transform-origin:0 0}
#docscale .sheet{margin:0 0 6px!important;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.okmark{width:64px;height:64px;border-radius:50%;background:#eaf5ee;color:var(--g);display:grid;place-items:center;font-size:34px;margin:20px auto 8px}
.bring{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:14.5px}.bring ul{margin:6px 0 0;padding-left:20px}
#offscreen{position:absolute;left:-12000px;top:0;width:210mm}
#printhost{position:absolute;left:-24000px;top:0;width:210mm}
#printhost .sheet{margin:0!important;box-shadow:none!important}

/* ---------------- QUOTE ---------------- */
/* ---- pro-rata first month ---- */
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
function proRata(){
  const on=V('q_pro')==='On';
  if(!on)return{on:false};
  const rent=N('rent');
  const d=parseDate(V('q_prodate')||V('l_start')||V('d_movein'));
  if(!rent||!d)return{on:true,ready:false};
  const y=d.getFullYear(), m=d.getMonth(), dim=daysInMonth(y,m), from=d.getDate();
  const occupied=dim-from+1;
  const basis=V('q_probasis')==='30-day month'?30:dim;
  const amt=Math.round(rent/basis*occupied*100)/100;
  const last=new Date(y,m,dim);
  return{on:true,ready:true,amt,occupied,basis,dim,from,
    label:"*Pro-rata rent "+from+" \u2013 "+fmtDate(last)+" ("+occupied+"/"+basis+" days)",
    range:fmtDate(d)+" to "+fmtDate(last)};
}

function quoteTotals(){
  const rent=N('rent'),mult=N('mult'),rate=N('vatrate')/100;
  const pr=proRata();
  const mRaw=EL('months')?EL('months').value.trim():'';
  const months=mRaw===''?(pr.on?0:1):(parseFloat(mRaw)||0);
  const lines=[{d:"*Deposit ("+money(rent)+" x "+mult+")",t:"",a:rent*mult}];
  if(pr.on&&pr.ready)lines.push({d:pr.label,t:"",a:pr.amt});
  if(months>0)lines.push({d:"*Rent for "+months+" month"+(months==1?"":"s")+" ("+money(rent)+" x "+months+")",t:"",a:rent*months});
  lines.push(...fees.map(f=>({d:f.name,t:f.vat?"Excl VAT":"",a:f.amt})));
  const vatBase=fees.filter(f=>f.vat).reduce((s,f)=>s+f.amt,0);
  const sub=lines.reduce((s,l)=>s+l.a,0);
  const vat=Math.round(vatBase*rate*100)/100;
  return{lines,vatBase,sub,vat,pr,months,tot:Math.round((sub+vat)*100)/100};
}
function renderProBox(){
  const b=EL('probox'); if(!b)return;
  const pr=proRata();
  if(!pr.on){b.innerHTML='';return}
  if(!pr.ready){b.innerHTML='<p class="hint" style="margin:6px 0 0">Set the rent and an occupation date (or the lease start date) to work out the pro-rata.</p>';return}
  b.innerHTML='<div style="background:#eef7f1;border-radius:7px;padding:9px 11px;margin-top:4px">'+
    '<div style="font-size:12.5px"><b>'+money(pr.amt)+'</b> for '+pr.occupied+' days</div>'+
    '<div style="font-size:11px;color:#555;margin-top:2px">'+esc(pr.range)+'</div>'+
    '<div style="font-size:11px;color:#777;margin-top:3px">'+money(N('rent'))+' \u00f7 '+pr.basis+' \u00d7 '+pr.occupied+'</div></div>';
}
function renderQuote(){
  renderProBox();
  const q=quoteTotals();
  const rows=q.lines.map(l=>l.t
    ? '<tr><td>'+esc(l.d)+'</td><td class="tag">'+esc(l.t)+'</td><td class="amt">'+money(l.a)+'</td></tr>'
    : '<tr><td colspan="2">'+esc(l.d)+'</td><td class="amt">'+money(l.a)+'</td></tr>').join("");
  EL('d-quote').innerHTML=
  '<div class="sheet" style="padding-top:0;padding-bottom:0">'+

function mandCalc(){
  const vr=N('m_vat')/100, cr=N('m_comm')/100;
  const insp=N('m_inspfee'), mand=N('m_mandfee');
  const R2=x=>Math.round(x*100)/100;
  const factor=1-cr*(1+vr);            // owner share of the tenant's rent
  let tenant=N('m_rent'), owner=N('m_owner_rent');
  if(!tenant&&!owner) tenant=N('rent');
  if(tenant&&!owner){ owner=R2(tenant-R2(R2(tenant*cr)*(1+vr))); }
  else if(owner&&!tenant){ tenant=factor>0?R2(owner/factor):0; }
  const c=R2(tenant*cr);
  const v=R2(c*vr);
  const cv=R2(c+v);
  if(!N('m_owner_rent')) owner=R2(tenant-cv);
  const init=R2(owner-insp-mand);
  return{tenant:R2(tenant),c,v,cv,owner:R2(owner),init,insp,mand};
}

  const T=18, rent=N('rent');

  const nb=(v)=>v?esc(v):'&nbsp;';
  const YN=(sel)=>sel==='YES'?'<b><u>YES</u> / NO</b>':(sel==='NO'?'<b>YES / <u>NO</u></b>':'<b>YES / NO</b>');

  const p1=
  '<div style="height:10mm"></div>'+
  '<h3 class="dt">LEASE AGREEMENT</h3>'+

  '<p class="cl" style="font-weight:700">EMMUNAH REAL ESTATES (PTY) LTD</p>'+
  '<p class="cl">Registration Number: 2019/619967/07</p>'+
  '<p class="cl">In their capacity as duly authorized and mandated agency on behalf of the owner of the property.</p>'+
  '<p class="cl">Hereinafter referred to as &ldquo;the Agent&rdquo;</p>'+
  '<p class="cl" style="margin-top:4mm">and</p>'+
  '<table class="ftab" style="margin-top:3mm">'+
  rowK("Full Names &amp; Surname / Company Name / Trust Name",nb(V('l_tenant')))+
  rowK("Represented by: (if Company or Trust)",nb(V('l_rep')))+
  rowK("ID / Passport / Company Registration / Trust Number",nb(V('l_tid')))+

  rowK("Contact number",nb(V('l_tcell')))+'</table>'+
  '<p class="cl" style="margin-top:2mm">(&lsquo;the First Tenant / Lessee&rsquo;)&nbsp;&nbsp;&nbsp;&nbsp;(&lsquo;the Second Tenant / Occupant&rsquo;: '+nb(V('l_t2'))+')</p>'+
  '<p class="cl" style="margin-top:4mm;font-weight:700">In respect of</p>'+
  '<table class="ftab">'+rowK("Address",nb(V('ref'))+(V('addr')?'<br>'+nl(V('addr')):''))+'</table>'+
  '<p class="cl" style="margin-top:2mm">(&lsquo;the Premises / Property&rsquo;)</p>'+
  '<table class="ftab" style="margin-top:4mm">'+
  rowK("Landlord Full Names &amp; Surname / Company Name / Trust Name",nb(V('m_owner')))+
  rowK("Landlord ID/Passport/ Registration No",nb(V('m_ownerreg')))+'</table>';

  const p2=
  '<h3 class="dt">THE SCHEDULE</h3>'+
  '<p class="cl" style="font-weight:700">LEASE PERIOD</p>'+
  '<table class="ftab" style="font-size:9pt">'+
  rowK("1. Commencement Date",nb(V('l_start')))+
  rowK("2. Termination Date",nb(V('l_end')))+
  rowK("3. Lease Duration",nb(V('l_dur')))+
  rowK("4. Required Notice Period",nb(V('l_notice'))+
    ' <span style="font-weight:400">(NB: Notice must be sent via email to rentals@betgroup.co.za. Refer to Clause 4 for early cancellation)</span>')+'</table>'+
  '<p class="cl" style="font-weight:700;margin-top:3mm">RENT</p>'+
  '<table class="ftab" style="font-size:9pt">'+
  rowK("5. Deposit",dep)+
  rowK("6. Monthly Rent",money(rent))+
  rowK("7. Annual Escalation",V('l_esc')+"%")+
  rowK("8. Lease Renewal fee","R"+V('l_renew')+" (incl VAT)")+
  rowK("9. Early Cancellation penalty",V('l_canpct')+"% of the rent for the remainder of term or a minimum of R"+
       V('l_canmin')+", whichever is greater. (Refer to clause 4)")+
  rowK("10. Lease Contract Fee","R"+V('l_contract')+" (incl VAT) (Non-refundable)")+
  rowK("11. Key Deposit","R"+V('l_key'))+
  rowK("12. Deposit Administration Fee","R"+V('l_depadmin')+" (incl VAT)")+
  rowK("13. Procurement Fee","R"+V('l_procure')+" (incl VAT) (Non-refundable)")+
  rowK("14. Rent Excludes",nb(V('l_excl')))+
  rowK("15. Payment Method",nb(V('l_pay'))+" (NB: Direct deposit will incur 10% fee of the amount deposited)")+
  rowK("16. Late Payment or Partial Payment Fee","R"+V('l_late')+" (incl VAT) (Any payment received after the 3rd is considered late payment)")+
  rowK("17. Exit Inspection Fee",V('l_exitinsp')?("R"+V('l_exitinsp')):"R&nbsp;")+
  rowK("17. Maximum Number of Occupants",nb(V('l_occ')))+
  rowK("18. Permission to Sublet",nb(V('l_sublet')))+'</table>'+
  '<p class="cl" style="font-weight:700;margin-top:3mm">PLEASE NOTE:</p>'+
  '<p class="cl i">1. Should rent not be paid on the 1st day of the month, the tenant will incur the following costs:</p>'+
  '<p class="cl ii">&#10148; SMS reminder &ndash; R10 (excl VAT)</p>'+
  '<p class="cl ii">&#10148; Email reminder &ndash; R25 (excl VAT)</p>'+
  '<p class="cl ii">&#10148; Letter of Demand &ndash; R250 (excl VAT)</p>'+
  '<p class="cl ii">&#10148; Phone Call &ndash; R30 (excl VAT)</p>'+
  '<p class="cl i">2. Please note if a tenant does not renew or cancel the lease, a fee of R250 (excl VAT) will be added to their monthly rent (month-to-month).</p>';

  const occRow=(n)=>'<tr><td class="k" style="width:50%">Name of occupant: '+nb(V('l_o'+n))+
    '</td><td>ID Number: '+nb(V('l_o'+n+'id'))+'</td></tr>';
  const p3=
  '<h3 class="dt">THE SCHEDULE (Continued)</h3>'+
  '<h4 class="s">19. The Tenant&rsquo;s contact details</h4>'+
  '<table class="ftab" style="font-size:9pt">'+
  rowK("Physical address",V('l_phys')?nl(V('l_phys')):'&nbsp;')+
  rowK("Postal address",V('l_postal')?nl(V('l_postal')):'&nbsp;')+
  '<tr><td class="k">Home telephone</td><td>'+nb(V('l_hometel'))+'</td></tr>'+
  '<tr><td class="k">Work telephone</td><td>'+nb(V('l_worktel'))+'</td></tr></table>'+

  rowK("Name and Surname",nb(V('l_kinname')))+
  rowK("Contact details",nb(V('l_kincontact')))+
  rowK("Relationship",nb(V('l_kinrel')))+'</table>'+
  '<h4 class="s">21. Maximum occupants, permanent vehicles and Alternative Accommodation</h4>'+
  '<p class="cl" style="font-size:8.5pt;font-style:italic">(number of occupants may not exceed municipal bylaw stipulations)</p>'+
  '<table class="ftab" style="font-size:9pt">'+
  rowK("Maximum occupants",nb(V('l_occ')))+
  occRow(1)+occRow(2)+occRow(3)+occRow(4)+occRow(5)+occRow(6)+

  '<tr><td class="k" style="width:50%">Vehicle registration number: '+nb(V('l_v1'))+
  '</td><td>Vehicle registration number: '+nb(V('l_v2'))+'</td></tr>'+
  '<tr><td class="k" style="width:50%">Vehicle registration number: '+nb(V('l_v3'))+
  '</td><td>Vehicle registration number: '+nb(V('l_v4'))+'</td></tr></table>'+
  '<p class="cl" style="margin-top:3mm"><b>22. Sales Commission: '+V('l_sales')+'%</b> (Should the Property be sold to the Tenant or any of their Family members, the Property Practitioner my claim '+V('l_sales')+'% commission from the proceeds of such sale)</p>'+
  '<p class="cl"><b>23. Smoking allowed:</b> '+YN(V('l_smoke'))+'</p>'+
  '<p class="cl"><b>24. Pets allowed:</b> '+YN(V('l_petsok'))+' &nbsp; If Yes, Number and details: '+nb(V('l_petdet'))+'</p>'+
  '<p class="cl"><b>25.</b> Report any faults of the property within seven (7) days of occupation to admine@betgroup.co.za OR rentals@betgroup.co.za</p>'+
  '<p class="cl" style="margin-top:2mm"><b>26. Special conditions:</b></p>'+
  '<div class="box" style="min-height:26mm;font-size:9.5pt">'+(V('l_special')?nl(V('l_special')):'&nbsp;')+'</div>';

  const p4=
  '<h3 class="dt">THE LEASE</h3>'+
  '<h4 class="s">1. Introduction</h4>'+
  '<p class="cl i">1.1 The Landlord leases the Premises to the Lessee and the Lessee lets the Premises from the Landlord in terms of this lease and subject to the terms of the title deed in respect of the Premises and/or the land on which the Premises is situated, and/or the rules of any Homeowner&rsquo;s Association or Body Corporate, where applicable.</p>'+
  '<p class="cl i">1.2 To the extent that this lease is governed by the Rental Housing Act No. 50 of 1999 (the "Rental Housing Act") and/or the Consumer Protection Act No. 68 of 2008 (the "Consumer Protection Act"), and/or the Electronic Communications and Transactions Act No. 25 of 2002 ("ECTA"), all provisions herein are to be interpreted in a manner compliant with the applicable statutory provisions.</p>'+
  '<p class="cl i">1.3 The Lessee shall only be entitled to use the Premises for RESIDENTIAL purposes.</p>'+
  '<p class="cl i">1.4 This Lease Agreement is to stand alone in interpretation.</p>'+
  '<h4 class="s">2. The Premises</h4>'+
  '<p class="cl i">2.1 The premises let by the Landlord to the Lessee shall be the property situated at the address set out on page 1 of this Lease Agreement.</p>'+
  '<h4 class="s">3. The Duration, Renewal and Termination of the Lease</h4>'+
  '<p class="cl i">3.1 The lease period shall commence on the commencement date and shall terminate on the termination date, (both dates inclusive) as defined in the Schedule (the &ldquo;lease period&rdquo;).</p>'+
  '<p class="cl i">3.2 In order to allow the Lessee to decide whether to continue with this Lease Agreement upon expiry of the Initial Period, the Landlord shall notify the Lessee in writing between forty (40) and eighty (80) business days prior to the expiry of the Initial Period of:</p>'+
  '<p class="cl ii">3.2.1 the impending termination date;</p>'+
  '<p class="cl ii">3.2.2 any material changes which would apply if the lease is renewed or may otherwise continue beyond the termination date or alternatively, whether the lease will terminate on the termination date; and</p>'+
  '<p class="cl ii">3.2.3 the fact that this Lease Agreement will automatically continue on a Month-to-Month basis upon expiry of the Initial Period, unless by no later than thirty (30) days (one calendar month) prior to the date upon which the Initial Period is due to terminate:</p>'+
  '<p class="cl ii" style="padding-left:23mm">(i) the Lessee expressly stipulates, in writing, that the Tenant wishes for the Lease Agreement to terminate on expiry of the Initial Period;</p>'+
  '<p class="cl ii" style="padding-left:23mm">(ii) an extension for a further fixed-term period, is agreed and signed in an addendum to this Lease Agreement by the parties or a new lease agreement is concluded replacing this Lease Agreement.</p>'+
  '<p class="cl i">3.3 On the termination date, the lease shall automatically continue on a month-to-month basis, and shall be subject to the same terms and conditions as this Lease Agreement, and subject to any material changes of which the Landlord has given notice in accordance with this Lease Agreement unless the Lessee expressly directs the Landlord to terminate the lease on the termination date or agrees to a renewal.</p>'+
  '<p class="cl i">3.4 Should this Lease Agreement continue on a Month-to-Month basis, the provisions of Section 14 of the CPA will no longer apply to this Lease Agreement.</p>'+
  '<p class="cl i">3.5 The Lessee shall have the right to renew this lease for a further period to be agreed upon between the parties, upon termination hereof. The lease renewal fee will be R500.00 (excl VAT).</p>';

  const p5=
  '<p class="cl i">3.6 Should the Lesse exercise the right of renewal, the amount of the rental payable by the Lessee will be confirmed between the parties, prior to signing the new agreement.</p>'+
  '<p class="cl i">3.7 The Lessee undertakes to vacate the property by no later than 12:00 (midday) on the agreed date, and has to submit the keys at Emmunah Real Estate&rsquo;s offices, or with the rental agent by no than 12:15 (midday) on the agreed date or last day of the month. Failure to submit the keys 12:15 (midday) at Emmunah Real Estate&rsquo;s office or with the rental agent will lead to Emmunah Real Estate charging the Lessee for an additional day/s rent and a R500.00 (FIVE HUNDRED RAND) excluding VAT late key submission penalty for each day that the Lessee has the keys in their possession.</p>'+
  '<p class="cl i">3.8 The premises must be cleaned and repaired by the Lessee before submission of the keys to Emmunah Real Estate. The Lessee acknowledges that submitting the keys to Emmunah Real Estate is a confirmation that you as Lessee are in agreement that you are satisfied with the condition of the premises.</p>'+
  '<p class="cl i">3.9 The Lessee furthermore acknowledges and accepts liability in respect of the payment of all costs with regards to the cleaning and/or repair of the property, if repairs and cleaning are not done up to standard and meaning the property is not given back in the same condition that it was given to the Lessee. Exit cleaning fee will be charged at a minimum of R1,000.00 and is subject to increase depending on the size of the Property and the condition in which it is returned at the end of the lease. This amount will be deducted from the deposit.</p>'+
  '<p class="cl i">3.10 Either party may elect to cancel this agreement and undertake to furnish to the other party at least 1 (ONE) calendar month&rsquo;s written notice of the intention to cancel the agreement.</p>'+
  '<h4 class="s">4. The Lessee&rsquo;s right to Terminate Early</h4>'+
  '<p class="cl i">4.1 In terms of section 14 of the Consumer Protection Act (CPA), the Lessee shall be entitled to to cancel this lease for any reason during the lease period by giving the Landlord 20 (twenty) business days (one calendar month) written notice of such cancellation. Should the Lessee exercise this right, they shall be liable to pay the Agency a reasonable cancellation penalty as per clause 4.4.</p>'+
  '<p class="cl i">4.2 In instances where the Landlord or Agent has cancelled the lease agreement due to the tenant being in breach of the lease agreement, the tenant will still be liable to pay the agency a reasonable cancellation fee as per clause 4.4.</p>'+
  '<p class="cl i">4.3 If the lease is not subject to section 14 of the Consumer Protection Act, the Lessee shall be entitled to cancel this lease for any reason during the lease period by giving the Landlord 60 (sixty) business days&rsquo; written notice of such cancellation.</p>'+
  '<p class="cl i">4.4 The tenant agrees that a reasonable cancellation penalty in terms of this clause shall constitute the following:</p>'+
  '<p class="cl ii">4.4.1 An amount equal to '+V('l_canpct')+'% of the monthly rental to be paid for the remainder of the lease term or a minimum of R'+V('l_canmin')+'. The calculation will be as follows: Monthly rental &times; '+V('l_canpct')+'% &times; Remaining Lease Term = Total Cancellation fee.</p>'+
  '<p class="cl ii">4.4.2 Any reasonable costs incurred by the Landlord or Agent in marketing or re-advertising the premises for the purpose of acquiring a replacement tenant; plus</p>'+
  '<p class="cl ii">4.4.3 The pro-rata portion of any Estate Agent&rsquo;s commission paid by the landlord calculated for the remainder of the lease period.</p>'+
  '<p class="cl ii">4.4.4 All fees and/or penalties pertaining to the cancellation of this lease agreement under clause 4 of this lease agreement is exclusive of VAT.</p>'+
  '<p class="cl i">4.5 Should the Lessee fail to provide at lease one (1) calendar month&rsquo;s written notice of termination, the Lessee shall be liable for an amount equivalent to one (1) month’s rental, being the following month&rsquo;s rent, PLUS the cancellation fee stipulated in clause 3.4 above.</p>'+
  '<h4 class="s">5. Termination of this Lease Agreement by the Landlord</h4>';

  const p6=
  '<p class="cl i">5.1 The landlord may in his sole discretion terminate this Lease Agreement on 2 (Two) months&rsquo; written notice in the following circumstances:</p>'+
  '<p class="cl ii">5.1.1 The Landlord intends to move into the Premises; or</p>'+
  '<p class="cl ii">5.1.2 the Landlord intends to sell the Premises.</p>'+
  '<p class="cl i">5.2 In the event that the Tenant is placed in breach of this Lease Agreement and remedies such breach on 3 (Three) separate occasions over a consecutive 3 (Three) month period, the Landlord shall be entitled to terminate this Lease Agreement on 20 (Twenty) business days (one calendar month) notice to the Lessee. In such an event:</p>'+
  '<p class="cl ii">5.2.1 the Landlord&rsquo;s right to terminate in terms of this clause 5.2 shall exist regardless of whether the Tenant remedies each breach prior to the expiry of each individual month within the 3 (three) month period contemplated above; and</p>'+
  '<p class="cl ii">5.2.2 the provisions of this clause 5.2 shall apply during the Initial Period as well as any renewal periods to this Lease Agreement.</p>'+
  '<p class="cl i">5.3 The Landlord may terminate this Lease Agreement with immediate effect and may demand that the Lessee vacate the Premises immediately and, in any event, within a period of no more than 24 (Twenty four) hours in the event that the Landlord, the Property Practitioner or the Body Corporate become aware of the fact that the Lessee is conducting any form of criminal or illegal activity, or has contravened any law or by-law whatsoever, including the Criminal Procedure Act 51 of 1977, the Counterfeit Goods Act 37 of 1997 and the Treatment of Substance Abuse Act 70 of 2008.</p>'+
  '<p class="cl i">5.4 In the event that the provisions of clause 5.3 apply, the Landlord shall not be obliged to prove the criminal or illegal activity in question but shall be required to report such activity to the South African Police Service or other applicable body, which reporting may be done anonymously; provided that there is no obligation on the Landlord to prove such reporting to the Lessee or any third party.</p>'+
  '<p class="cl i">5.5 In the event that the Lessee provides the Landlord or Property Practitioner with incorrect / fraudulent information or documentation during the application process conducted before the conclusion of this Lease Agreement (Application Process), or omits to provide any relevant information or documentation, whether intentionally or in error, the Landlord will be entitled to terminate the Lease Agreement with immediate effect. It is specifically recorded that all documentation and information provided or required during the Application Process form the basis upon which the Landlord concluded this Lease Agreement with the Lessee.</p>'+
  '<h4 class="s">6. Monthly Rental</h4>'+
  '<p class="cl i">6.1 The Lessee must pay rental, for each and every month of the duration of this lease, of the amount specified in clause 6 of the Schedule.</p>'+
  '<p class="cl i">6.2 All payments received will firstly be appropriated against rent, and thereafter towards electricity and water accounts.</p>'+
  '<p class="cl i">6.3 The Lessee accepts that a late payment fee of R500.00 (FIVE HUNDRED RANDS) excluding VAT is payable on all late rental payments received, as well as on all short rental payments received.</p>'+
  '<p class="cl i">6.4 The parties agree that interest calculated at 3 (THREE) percent above the prime interest rate will be charged on any outstanding balances reflected on the Lesse&rsquo;s statement of account which is due to the Landlord.</p>'+
  '<p class="cl i">6.5 The Lessee will not be entitled to set off any alleged or actual expense from any rental or other payments due to the Landlord in terms hereof, regardless of whether the Landlord is indebted to the Lessee and/or in breach of any obligation to the Lessee.</p>'+
  '<p class="cl i">6.6 All payments are to be made by means of electronic funds transfer on or before the First Day of each and every month to the following bank account:</p>'+
  '<p class="cl ii">First National Bank (FNB)<br>Account Name: Emmunah Real Estates<br>Branch Code: 250655<br>Account number: 63111610225<br>Reference: Please use reference as per your statement <i>(R150.00 fee will be charged if a wrong reference is used)</i></p>'+
  '<p class="cl i" style="font-style:italic">*Please note that Direct Cash Deposits will incur a 10% fee of the deposited amount.*</p>';

  const p7=
  '<h4 class="s">7. Acceptance of Contract and Payment of Deposit</h4>'+
  '<p class="cl i">7.1 Should the Lessee receive confirmation from the Landlord that his/her application has been accepted, the Lessee shall be obliged to pay a Deposit as security for the fulfilment of his/her obligations in terms of this Lease in an amount equal to 1.5 X month&rsquo;s rental value, as set out in clause 5 of the Schedule.</p>'+
  '<p class="cl i">7.2 In the event of the rental being increased, the Deposit shall be increased accordingly and the Lessee shall be obliged to pay the additional amount of the deposit to the Landlord immediately.</p>'+
  '<p class="cl i">7.3 The Landlord shall invest the deposit in an interest-bearing account for the benefit of the Lessee.</p>'+
  '<p class="cl i">7.4 The Deposit remains the property of the Lessee at all times during the subsistence of this Lease and may only be utilized by the Landlord in accordance with the provisions of the Rental Housing Act, No 50 of 1999.</p>'+
  '<p class="cl i">7.5 The Deposit will be held as security for the performance of the Lessee’s obligations under this Agreement and to compensate the Landlord for any breach by the Lessee of any obligations set out in this Agreement.</p>'+
  '<p class="cl i">7.6 The Deposit will be held until after the termination of this Lease when the Lessee has vacated the Premises and has discharged all of his or her obligations to the Landlord under this Agreement.</p>'+
  '<p class="cl i">7.7 The Landlord shall then have the right, in accordance with the provisions of the Rental Housing Act, to make necessary deductions from the Deposit plus any interest earned thereon, to cover any liability of whatsoever nature for which the Lessee is responsible in terms of this Agreement, including without limitation any legal costs incurred by the Landlord as a result of a breach of this Agreement by the Lessee, including but not limited to damage to property, furniture or other movable and/or immovable property that forms part of the premises.</p>'+
  '<p class="cl i">7.8 The Lessee shall not be entitled to withhold payment of any installment of Rental or any other monies payable under this Agreement on the ground that the Landlord holds the Deposit or any part of it. <b>THE LESSEE REMAINS LIABLE TO PAY THE LAST MONTH&rsquo;S RENT.</b></p>'+
  '<p class="cl i">7.9 The balance of the deposit (if any), together with any interest earned thereon, will be refunded to the Lessee within 14 (fourteen) working days of restoration of the Property.</p>'+
  '<p class="cl i">7.10 If the whole or any portion of the Deposit is used or if the amount of monies that the Landlord is entitled to deduct from the Deposit exceeds the amount held as the Deposit, then the Lessee shall be liable to the Landlord for such additional amount which amount will be payable immediately.</p>'+
  '<p class="cl i">7.11 The Landlord and Lessee shall establish the condition of the premises at the end of the Lease during the final inspection. Should the Lessee fail to attend such inspection, the Lessee will waive all rights to query any deductions made from the deposit held and the Landlord&rsquo;s decision will be final and irrevocable as to the extent of the Deposit claim permitted for damages.</p>';

  const p8=
  '<h4 class="s">8. Acknowledgement by Lessee</h4>'+
  '<p class="cl">The Lessee confirms and acknowledges that:</p>'+
  '<p class="cl i">8.1 The premises were duly identified;</p>'+
  '<p class="cl i">8.2 The premises comply with the purpose which the Lessee intends of using it;</p>'+
  '<p class="cl i">8.3 The Landlord has not given any warranties in respect of the fitness or suitability of the premises for any purpose;</p>'+
  '<p class="cl i">8.4 The premises may only be used for the purposes stated in the agreement, which is for purposes of a residential dwelling and for no other purpose whatsoever. The Landlord determines in his sole discretion whether anything done or to be done by the Lessee is permissible in terms hereof.</p>'+
  '<p class="cl i">8.5 The premises will be deemed to be in a satisfactory condition at the commencement of the lease period unless the Lessee notifies the Landlord in writing of any damages or shortcoming withing 5 (FIVE) days from the commencement date of this lease. Should the Lessee fail to furnish the list of defects to the Landlord, the Lessee shall be deemed to have acknowledged that no defects exists and that occupation of the property is taken in good condition.</p>'+

</script><script>/* ---- keep every page inside its A4 box so the INITIAL line is always reachable ---- */
let PXMM=0;
function pxPerMm(){
  if(PXMM)return PXMM;
  try{
    const probe=document.createElement('div');
    probe.style.cssText='position:absolute;visibility:hidden;height:100mm';
    document.body.appendChild(probe);
    PXMM=probe.offsetHeight/100;
    document.body.removeChild(probe);
  }catch(e){}
  if(!PXMM||!isFinite(PXMM))PXMM=3.7795;
  return PXMM;
}
function fitPages(root){
  if(!root||!root.querySelectorAll)return;
  const sheets=[]; const all=root.querySelectorAll('.sheet');
  for(let i=0;i<all.length;i++)sheets.push(all[i]);
  if(!sheets.length)return;
  const mm=pxPerMm(), PAGE=297*mm;

  sheets.forEach(sh=>{
    let body=null;
    for(let c=0;c<sh.children.length;c++)
      if(sh.children[c].className==='pbody'){body=sh.children[c];break}
    if(!body){
      body=document.createElement('div'); body.className='pbody';
      const kids=[]; for(let c=0;c<sh.childNodes.length;c++)kids.push(sh.childNodes[c]);
      kids.forEach(nd=>{
        const skip=nd.nodeType===1&&nd.className&&
          (String(nd.className).indexOf('pfoot')>=0||String(nd.className).indexOf('toolongtag')>=0);
        if(!skip)body.appendChild(nd);
      });
      sh.insertBefore(body,sh.firstChild);
    }
    sh.__body=body;
  });

  const MINFS=0.55;
  const avail=sh=>{                       // measured off the fixed A4 box, not the grown element
    let cs; try{cs=getComputedStyle(sh)}catch(e){return 0}
    return PAGE-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
  };
  const ratio=()=>{
    let worst=1;
    sheets.forEach(sh=>{
      const a=avail(sh), need=sh.__body?sh.__body.scrollHeight:0;
      if(a>0&&need>0){const r=a/need; if(r<worst)worst=r}
    });
    return worst;
  };
  const setAll=v=>sheets.forEach(sh=>sh.style.setProperty('--fs',String(v)));

  setAll(1);
  let r=ratio(), fs=1;
  if(r<1){
    fs=Math.max(MINFS,r*0.985);
    setAll(fs);
    for(let i=0;i<12&&fs>MINFS;i++){
      if(ratio()>=1)break;
      fs=Math.max(MINFS,fs-0.015);
      setAll(fs);
    }
  }
  // flag anything that still will not fit rather than quietly cutting it off
  sheets.forEach(sh=>{
    const a=avail(sh), need=sh.__body?sh.__body.scrollHeight:0;
    const over=need>a+2;
    sh.className=sh.className.replace(/\s*toolong/g,'')+(over?' toolong':'');
    let tag=null;
    for(let c=0;c<sh.children.length;c++)
      if(String(sh.children[c].className).indexOf('toolongtag')>=0){tag=sh.children[c];break}
    if(over&&!tag){
      tag=document.createElement('div'); tag.className='toolongtag';
      tag.textContent='Content runs past this page';
      sh.appendChild(tag);
    }else if(!over&&tag){ sh.removeChild(tag) }
  });
}

    h='<div class="kick">Read before you sign</div><h2>Your '+escH(FORM.docname)+'</h2>'+
      '<p class="lead">This is the full document with your details filled in. Scroll through all '+'<span id="pgn"></span> pages. Anything wrong? Tap <b>Back</b> to fix it.</p>'+
      '<div id="docwrap"><div id="docscale"></div></div>';
    btn='I have read it — sign';
  }else if(cur.k==='sign'){
    h='<div class="kick">Last step</div><h2>Sign</h2>'+
      '<p class="lead">Sign with your finger. Your signature goes on the signature line and your initials on the foot of every page.</p>'+
      '<div class="fld"><label>Full name of the person signing</label><input id="in_signer" value="'+escH(ST.__signer||FORM.signerDefault()||'')+'" oninput="ST.__signer=this.value;keep()"></div>'+
      '<div class="fld"><label>Signed at (town)</label><input id="in_place" value="'+escH(ST.__place||'Polokwane')+'" oninput="ST.__place=this.value;keep()"></div>'+
      '<div class="padlab">Signature <button type="button" class="link" onclick="SIG.clear()">Clear</button></div><canvas id="sigpad" class="pad"></canvas>'+
      '<div class="padlab">Initials <button type="button" class="link" onclick="INI.clear()">Clear</button></div><canvas id="inipad" class="pad small"></canvas>'+
      '<label class="agree"><input type="checkbox" id="agree"> '+escH(FORM.agree)+'</label><div class="er" id="er_sign"></div>';
    btn='Sign and create PDF';
  }else if(cur.k==='done'){
    h='<div class="okmark">✓</div><h2 style="text-align:center">Signed</h2>'+
      '<p class="lead" style="text-align:center">Your signed '+escH(FORM.docname)+' is ready. Send it back to '+escH(FORM.agentName)+' on WhatsApp.</p>'+
      '<div class="stack">'+
      (canShare()?'<button class="primary" onclick="sharePdf()">Share the signed PDF…</button>':'')+
      '<button class="'+(canShare()?'':'primary')+'" onclick="savePdf()">Download the signed PDF</button>'+
      '<button onclick="sendWa()">Send my details on WhatsApp</button></div>'+
      '<p class="small">On WhatsApp: send the message, then attach the PDF (📎 → Document).</p>'+
      (FORM.bring?'<div class="bring"><b>Please also send</b><ul>'+FORM.bring.map(x=>'<li>'+escH(x)+'</li>').join('')+'</ul></div>':'');
    btn='';
  }
  app.innerHTML=h;
  $('#next').textContent=btn; $('#next').style.display=btn?'':'none';
  if(cur.k==='review')showDoc();
  if(cur.k==='sign'){SIG=pad($('#sigpad'),ST.__sig);INI=pad($('#inipad'),ST.__ini)}
}

/* ---------- the document ---------- */
function renderDocInto(){
  FORM.render(); const root=document.getElementById(FORM.root);
  try{fitPages(root)}catch(e){}
  return root;
}
function showDoc(){
  const root=renderDocInto();
  const wrap=$('#docwrap'), sc=$('#docscale');
  sc.innerHTML=''; [...root.querySelectorAll('.sheet')].forEach(s=>sc.appendChild(s.cloneNode(true)));
  $('#pgn').textContent=sc.querySelectorAll('.sheet').length;
  const fit=()=>{const w=wrap.clientWidth, full=210*pxmm(), k=Math.min(1,w/full);
    sc.style.transform='scale('+k+')'; sc.style.width=full+'px'; wrap.style.height=(sc.scrollHeight*k)+'px'};
  fit(); window.onresize=fit;
}
let PXM=0; function pxmm(){if(PXM)return PXM;const d=document.createElement('div');d.style.cssText='position:absolute;visibility:hidden;width:100mm';document.body.appendChild(d);PXM=d.offsetWidth/100;d.remove();return PXM}

/* ---------- signature pads ---------- */
function pad(cv,init){
  const r=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*r; cv.height=H*r; const c=cv.getContext('2d'); c.scale(r,r);
  c.lineWidth=2.4; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#0b1f4a';
  let down=false, last=null, ink=false;
  if(init){const im=new Image();im.onload=()=>{c.drawImage(im,0,0,W,H);ink=true};im.src=init}
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
  cv.onpointerdown=e=>{down=true;last=pos(e);cv.setPointerCapture(e.pointerId);c.beginPath();c.arc(last.x,last.y,1.1,0,7);c.fillStyle='#0b1f4a';c.fill();ink=true;e.preventDefault()};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);c.beginPath();c.moveTo(last.x,last.y);c.lineTo(p.x,p.y);c.stroke();last=p;ink=true;e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  return{clear(){c.clearRect(0,0,W,H);ink=false},has:()=>ink,
    png(){ // trim to the ink so it sits neatly on the line
      const d=c.getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=0,y1=0;
      for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++)if(d[(y*cv.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      if(x1<=x0)return cv.toDataURL('image/png');
      const pd=6*r, o=document.createElement('canvas');o.width=x1-x0+pd*2;o.height=y1-y0+pd*2;
      o.getContext('2d').drawImage(cv,x0-pd,y0-pd,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')}};
}

/* ---------- finish: stamp signatures, build the PDF ---------- */
function stamp(root,sig,ini,place){
  const now=new Date(), day=String(now.getDate()), mon=MON[now.getMonth()], yy=String(now.getFullYear()).slice(2);
  const img=(src,h)=>'<img src="'+src+'" style="position:absolute;left:2mm;bottom:-1.2mm;height:'+h+'mm;max-width:100%;object-fit:contain">';
  const txt=t=>'<span style="position:absolute;left:1mm;bottom:.2mm;font-size:10pt;font-family:\'Bradley Hand\',\'Segoe Script\',cursive;color:#0b1f4a;white-space:nowrap">'+escH(t)+'</span>';
  const sheets=[...root.querySelectorAll('.sheet')];
  // initials on every page footer that asks for them
  sheets.forEach(sh=>{sh.querySelectorAll('.pfoot span span').forEach(u=>{u.style.position='relative';u.innerHTML='&nbsp;'+img(ini,8)})});
  // the signing block on the last page
  const sigEl=sheets[sheets.length-1].querySelector('.sig'); if(!sigEl)return;
  const ln=[...sigEl.querySelectorAll('.ln')];
  const fill=(i,html)=>{const s=ln[i];if(!s)return;s.style.position='relative';s.innerHTML=html};
  fill(0,txt(place));fill(1,txt(day));fill(2,txt(mon));fill(3,txt(yy));fill(4,img(sig,11));
}
async function finish(){
  const er=$('#er_sign');
  if(!SIG.has()){er.textContent='Please sign in the box.';return}
  if(!INI.has()){er.textContent='Please add your initials.';return}
  if(!$('#agree').checked){er.textContent='Please tick the box to confirm.';return}
  ST.__signer=$('#in_signer').value.trim(); ST.__place=$('#in_place').value.trim()||'Polokwane';
  if(!ST.__signer){er.textContent='Please type your full name.';return}
  ST.__sig=SIG.png(); ST.__ini=INI.png(); keep();
  $('#next').disabled=true; $('#next').textContent='Creating your PDF…';
  try{PDFBLOB=await buildPdf()}catch(e){console.error(e);er.textContent='Could not create the PDF ('+(e&&e.message||'error')+'). Check your internet and try again.';$('#next').disabled=false;$('#next').textContent='Sign and create PDF';return}
  $('#next').disabled=false; go(STEP+1);
}
function loadJs(u,ok){return new Promise((res,rej)=>{if(ok())return res();const s=document.createElement('script');s.src=u;s.onload=()=>ok()?res():rej(new Error('load'));s.onerror=()=>rej(new Error('offline'));document.head.appendChild(s)})}
async function buildPdf(){
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
  await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf&&window.jspdf.jsPDF);
  const root=renderDocInto();
  stamp(root,ST.__sig,ST.__ini,ST.__place||'Polokwane');
  const host=$('#printhost'); host.innerHTML=''; [...root.querySelectorAll('.sheet')].forEach(s=>host.appendChild(s));
  const sheets=[...host.querySelectorAll('.sheet')];
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  for(let i=0;i<sheets.length;i++){
    $('#next').textContent='Creating your PDF… page '+(i+1)+' of '+sheets.length;
    const cv=await html2canvas(sheets[i],{scale:1.6,backgroundColor:'#ffffff',useCORS:true,logging:false});
    if(i)pdf.addPage();
    pdf.addImage(cv.toDataURL('image/jpeg',0.82),'JPEG',0,0,210,297,undefined,'FAST');
  }
  // an invisible text layer so the agent's suite can read the details straight off the PDF
  pdf.setPage(1); pdf.setFontSize(4);
  const data=FORM.data(); data.__form=FORM.kind; data.__signed=fmtD(new Date()); data.__signer=ST.__signer||'';
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  pdf.text('EMMUNAH '+FORM.docname.toUpperCase()+' EMMUNAH-FORM-DATA:',2,2,{renderingMode:'invisible'});
  for(let i=0,n=0;i<b64.length;i+=90,n++)pdf.text('EFD'+n+':'+b64.slice(i,i+90),2,3.6+n*1.6,{renderingMode:'invisible'});
  pdf.setProperties({title:FORM.docname+' - '+(FORM.signerDefault()||''),author:'Emmunah Real Estate',subject:'Signed '+fmtD(new Date())});
  host.innerHTML='';
  return pdf.output('blob');
}
const pdfName=()=>(FORM.fileName()+' - signed.pdf').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ');
function savePdf(){if(!PDFBLOB)return;const a=document.createElement('a');a.href=URL.createObjectURL(PDFBLOB);a.download=pdfName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function canShare(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]}))}catch(e){return false}}
async function sharePdf(){try{await navigator.share({files:[new File([PDFBLOB],pdfName(),{type:'application/pdf'})],title:FORM.docname,text:waText()})}catch(e){if(e&&e.name!=='AbortError')savePdf()}}
function waText(){
  const L=['*'+FORM.waHeader+'*'];
  FORM.waLines().forEach(([k,v])=>{if(v)L.push(k+': '+v)});
  L.push('Signed: Yes ('+fmtD(new Date())+', '+(ST.__place||'Polokwane')+')');
  L.push('','The signed PDF follows.');
  return L.join('\n');
}
function sendWa(){location.href='https://wa.me/'+AGENT_WA+'?text='+encodeURIComponent(waText())}
